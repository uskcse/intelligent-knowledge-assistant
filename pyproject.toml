[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Intelligent Knowledge Assistant: local-first RAG + agentic QA over a document corpus."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Senior AI Engineer Candidate" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2.28",
    "langchain-core>=0.3",
    "ollama>=0.3.1",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tenacity>=8.4",
    "tiktoken>=0.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["chainlit>=1.1"]
openai = ["openai>=1.40"]
ragas = ["ragas>=0.1.21", "datasets>=2.20", "langchain-ollama>=0.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
ka-ingest = "knowledge_assistant.ingestion.cli:app"
ka-eval = "knowledge_assistant.eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = ["B008"]  # FastAPI/Typer use function calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
packages = ["knowledge_assistant"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require live Ollama/Chroma services",
]

[tool.coverage.run]
source = ["knowledge_assistant"]
branch = true
