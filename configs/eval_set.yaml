# ---------------------------------------------------------------------------
# Evaluation set for the Knowledge Assistant.
# Categories: simple | multi_step | ambiguous | unanswerable
# Fields:
#   question             - the user query
#   category             - evaluation bucket
#   expected_documents   - documents that SHOULD be retrieved (retrieval metrics)
#   expected_workflow    - rag | agentic (routing check; omit if not asserted)
#   expect_abstain       - true if the system SHOULD decline to answer
#   key_facts            - lowercase substrings expected in a correct answer
# ---------------------------------------------------------------------------

- id: q1
  category: simple
  question: "What chunking strategies does the RAG architecture reference describe?"
  expected_documents: ["rag_architecture_patterns.pdf"]
  expected_workflow: rag
  expect_abstain: false
  key_facts: ["chunk", "sentence"]

